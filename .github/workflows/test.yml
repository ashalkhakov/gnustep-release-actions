name: Test

# The workflows and actions here, tested as they are in this commit, on the
# sample in test/sample: the smallest repository with everything they handle
# (a library and an application on it, for Linux, macOS and iOS, an
# AppImage and an image), built, tested, installed and packaged, without a
# tag: nothing signed or released. A change is proven in its own pull
# request, before any repository uses it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/linux.yml
    with:
      directory: test/sample
      library: true

  macos:
    uses: ./.github/workflows/macos.yml
    with:
      directory: test/sample
      library: true
      apps: Sample=SampleApp

  ios:
    uses: ./.github/workflows/ios.yml
    with:
      directory: test/sample
      apps: Sample-iOS=SampleApp

  docker:
    uses: ./.github/workflows/docker.yml
    with:
      directory: test/sample
      dockerfile: Dockerfile
      images: =gnustep-release-actions-sample
      description: gnustep-release-actions' sample
