# An iOS app's release, unsigned, the same for every repository: built by
# the repository's hook, tested in a simulator, packaged as an .ipa (for a
# signing step to take later) and a simulator build, uploaded, and for a tag
# attached to the release.
#
# The repository supplies names (inputs) and hooks (run from its root):
#   .github/release/ios-build.sh   builds; leaves each app, by bundle name, in
#                                  $RELEASE_DIR/iphoneos (the device build) and
#                                  $RELEASE_DIR/iphonesimulator
#   .github/release/ios-test.sh    optional; given a simulator app's path,
#                                  tests it in a simulator
# Both see TAG, APP_VERSION, BUILD_NUMBER, RELEASE_DIR and the pins.
on:
  workflow_call:
    inputs:
      repository:
        description: The repository to build (default the calling one; gnustep-release-actions' own test builds an app's)
        type: string
        default: ''
      ref:
        description: The commit or branch of it to build (default the tag, else the commit that started the run)
        type: string
        default: ''
      tag:
        description: The tag to build and attach to (empty for a push's own tag, or none)
        type: string
        default: ''
      apps:
        description: Space-separated Name=Bundle pairs (SimpleNotes-iOS=SimpleNotes); <Name>-<version>-unsigned.ipa and <Name>-Simulator-<version>.zip
        type: string
        required: true
      dependencies:
        description: Space-separated ashalkhakov repositories checked out beside source/ at their pins
        type: string
        default: ''

jobs:
  ios:
    name: iOS
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      APPS: ${{ inputs.apps }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || inputs.tag || (github.ref_type == 'tag' && github.ref_name) || github.ref }}
          path: source

      # This workflow's own commit, whatever the caller named (@v1, a branch,
      # a commit): its scripts and actions come from there, so a change here
      # is tested as one, and v1 is exactly what v1 holds.

      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-actions

      - name: Pins and dependencies
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
        run: '"$GITHUB_WORKSPACE/.release-actions/scripts/pins-and-dependencies.sh"'

      - name: Version
        run: '"$GITHUB_WORKSPACE/.release-actions/scripts/version.sh"'

      # The version into every Xcode project, .xcconfig, Info.plist and app
      # GNUmakefile the repository has, before its build: the same way for
      # every app, so no app stamps its own.
      - name: Stamp the version
        run: '"$GITHUB_WORKSPACE/.release-actions/scripts/stamp-version.sh"'

      - name: Build
        run: |
          mkdir -p "$RELEASE_DIR/iphoneos" "$RELEASE_DIR/iphonesimulator"
          ./.github/release/ios-build.sh
          for pair in $APPS; do
            for sdk in iphoneos iphonesimulator; do
              [ -d "$RELEASE_DIR/$sdk/${pair#*=}.app" ] || { echo "::error::ios-build.sh left no $sdk/${pair#*=}.app in \$RELEASE_DIR"; exit 1; }
            done
          done

      - name: Test, in a simulator
        run: |
          [ -x .github/release/ios-test.sh ] || { echo "no .github/release/ios-test.sh"; exit 0; }
          for pair in $APPS; do ./.github/release/ios-test.sh "$RELEASE_DIR/iphonesimulator/${pair#*=}.app"; done

      - name: Package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          for pair in $APPS; do
            name=${pair%%=*}; bundle=${pair#*=}
            ipa=$(mktemp -d)
            mkdir -p "$ipa/Payload"
            cp -R "$RELEASE_DIR/iphoneos/$bundle.app" "$ipa/Payload/"
            (cd "$ipa" && zip -qry "$GITHUB_WORKSPACE/out/$name-$APP_VERSION-unsigned.ipa" Payload)
            ditto -c -k --keepParent "$RELEASE_DIR/iphonesimulator/$bundle.app" "$GITHUB_WORKSPACE/out/$name-Simulator-$APP_VERSION.zip"
          done
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: iOS-${{ github.run_number }}
          path: ${{ github.workspace }}/out/*
          if-no-files-found: error

      - name: Attach to the release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          files: ${{ github.workspace }}/out/*
