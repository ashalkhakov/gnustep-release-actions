# A repository's Mac build, the same for every repository: what it builds on
# (its .github/pins.env: our libraries' XCFrameworks and Sparkle's, each from
# its release) unpacked into .deps/, then its own Makefile.apple, the familiar
# way:
#
#   make -f Makefile.apple                         build
#   make -f Makefile.apple check                   test
#   make -f Makefile.apple install DESTDIR=<dir>   install: each app (apps:,
#                                                  by its bundle name), and a
#                                                  library's XCFrameworks
#   make -f Makefile.apple installcheck DESTDIR=<dir>   optional: test what was
#                                                  installed; again once signed
#                                                  (the hardened runtime loads
#                                                  only frameworks signed by
#                                                  the same team)
#
# then packaged: each app universal, with Sparkle, zipped as
# <Name>-macOS-<version>.zip, and for a tag signed, notarized and its Sparkle
# appcast written; a library's XCFrameworks zipped as
# <repository>-<version>-apple.zip for what builds on it. Uploaded, and for a
# tag attached to the release. Secrets come from the calling repository's
# `production` environment, read by a tag's run only.
on:
  workflow_call:
    inputs:
      repository:
        description: The repository to build (default the calling one; gnustep-release-actions' own test builds an app's)
        type: string
        default: ''
      ref:
        description: The commit or branch of it to build (default the tag, else the commit that started the run)
        type: string
        default: ''
      tag:
        description: The tag to build and attach to (empty for a push's own tag, or none)
        type: string
        default: ''
      directory:
        description: Where in the repository it is (its root by default)
        type: string
        default: .
      library:
        description: A library, whose XCFrameworks (make install puts them in DESTDIR) are published for what builds on it
        type: boolean
        default: false
      apps:
        description: >
          Space-separated Name=Bundle pairs: each app's release name and its
          bundle name (SimpleNotes=SimpleNotes, ODataWorkbench=Workbench).
          The zip is <Name>-macOS-<version>.zip; the appcast appcast.xml, or
          appcast-<Name>.xml when there are several.
        type: string
        default: ''

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 90
    # The signing, notarization and Sparkle secrets live in this environment;
    # only a tag's run reads them.
    environment: production
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      APPS: ${{ inputs.apps }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source/${{ inputs.directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || inputs.tag || (github.ref_type == 'tag' && github.ref_name) || github.ref }}
          path: source
          # The whole history: the build number is the commit count (scripts/version.sh).
          fetch-depth: 0

      # This workflow's own commit, whatever the caller named (@v1, a branch,
      # a commit): its scripts and actions come from there, so a change here
      # is tested as one, and v1 is exactly what v1 holds.

      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-actions

      - name: Version
        run: '"$GITHUB_WORKSPACE/.release-actions/scripts/version.sh"'

      # The version into every Xcode project, .xcconfig, Info.plist and app
      # GNUmakefile the repository has, before its build: the same way for
      # every app, so no app stamps its own.
      - name: Stamp the version
        run: '"$GITHUB_WORKSPACE/.release-actions/scripts/stamp-version.sh"'

      - name: The artifact's name
        run: |
          set -- $APPS
          if [ $# = 1 ]; then name=${1%%=*}; else name=$(basename "${{ inputs.repository || github.repository }}"); fi
          echo "ARTIFACT=$name-macOS-$APP_VERSION" >> "$GITHUB_ENV"

      - name: What it builds on
        run: '"$GITHUB_WORKSPACE/.release-actions/scripts/deps.sh" apple'

      - name: make
        run: |
          xcodebuild -version
          make -f Makefile.apple

      - name: make check
        run: make -f Makefile.apple check

      - name: make install
        run: |
          mkdir -p "$RELEASE_DIR"
          make -f Makefile.apple install DESTDIR="$RELEASE_DIR"
          ls -la "$RELEASE_DIR"
          for pair in $APPS; do
            app="$RELEASE_DIR/${pair#*=}.app"
            [ -d "$app" ] || { echo "::error::make install put no ${pair#*=}.app in DESTDIR"; exit 1; }
            exe=$(defaults read "$app/Contents/Info" CFBundleExecutable)
            lipo "$app/Contents/MacOS/$exe" -verify_arch arm64 x86_64
            [ -d "$app/Contents/Frameworks/Sparkle.framework" ] || { echo "::error::$(basename "$app") does not embed Sparkle.framework"; exit 1; }
          done

      - name: make installcheck
        timeout-minutes: 20
        run: |
          grep -q '^installcheck:' Makefile.apple || { echo "Makefile.apple has no installcheck"; exit 0; }
          make -f Makefile.apple installcheck DESTDIR="$RELEASE_DIR"

      # A tag's build only: every other one is uploaded unsigned, named so.
      - name: Sign
        id: sign
        if: env.TAG != ''
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          signed=false
          for pair in $APPS; do
            out=$(mktemp)
            APP="$RELEASE_DIR/${pair#*=}.app" GITHUB_OUTPUT="$out" "$GITHUB_WORKSPACE/.release-actions/macos-sign/sign.sh"
            grep -q '^signed=true' "$out" && signed=true
          done
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: make installcheck, signed
        if: steps.sign.outputs.signed == 'true'
        timeout-minutes: 20
        run: |
          grep -q '^installcheck:' Makefile.apple || exit 0
          make -f Makefile.apple installcheck DESTDIR="$RELEASE_DIR"

      - name: Notarize
        if: steps.sign.outputs.signed == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          for pair in $APPS; do
            APP="$RELEASE_DIR/${pair#*=}.app" GITHUB_OUTPUT=/dev/null "$GITHUB_WORKSPACE/.release-actions/macos-notarize/notarize.sh"
          done

      - name: Package
        run: |
          suffix=""
          [ "${{ steps.sign.outputs.signed }}" = "true" ] || suffix="-unsigned"
          mkdir -p "$GITHUB_WORKSPACE/out"
          for pair in $APPS; do
            ditto -c -k --keepParent "$RELEASE_DIR/${pair#*=}.app" "$GITHUB_WORKSPACE/out/${pair%%=*}-macOS-${APP_VERSION}${suffix}.zip"
          done
          # A library's XCFrameworks, together, as what builds on it unpacks
          # them into its .deps/ (scripts/deps.sh).
          if [ "${{ inputs.library }}" = true ]; then
            name=$(basename "${{ inputs.repository || github.repository }}" | tr 'A-Z' 'a-z')
            (cd "$RELEASE_DIR" && ls -d *.xcframework > /dev/null 2>&1) \
              || { echo "::error::make install put no .xcframework in DESTDIR"; exit 1; }
            # ditto, as deps.sh unpacks it: a framework is symlinks inside.
            frameworks=$(mktemp -d)
            cp -R "$RELEASE_DIR"/*.xcframework "$frameworks/"
            ditto -c -k "$frameworks" "$GITHUB_WORKSPACE/out/$name-$APP_VERSION-apple.zip"
          fi
          ls -la "$GITHUB_WORKSPACE/out"

      # For a release only, signed: the feed each app's Sparkle reads
      # (SUFeedURL, the newest release's appcast).
      - name: Appcast
        if: steps.sign.outputs.signed == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -- $APPS
          for pair in "$@"; do
            name=${pair%%=*}
            output=appcast.xml
            [ "$#" = 1 ] || output="appcast-$name.xml"
            ARCHIVE="$GITHUB_WORKSPACE/out/$name-macOS-$APP_VERSION.zip" OUTPUT="$GITHUB_WORKSPACE/out/$output" \
              SPARKLE_VERSION=2.10.0 GITHUB_OUTPUT=/dev/null "$GITHUB_WORKSPACE/.release-actions/sparkle-appcast/appcast.sh"
          done

      # Named for the app and its version, like the files in it; a branch's
      # is kept two weeks, a tag's as long as artifacts are (its release
      # keeps the files for good).
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ github.workspace }}/out/*
          if-no-files-found: error
          retention-days: ${{ env.TAG == '' && 14 || 90 }}

      # What Xcode recorded of a failed test, for opening in Xcode.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ env.ARTIFACT }}-test-results
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach to the release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          files: ${{ github.workspace }}/out/*
