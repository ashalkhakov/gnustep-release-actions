# A repository's iOS build, unsigned, the same for every repository: what it
# builds on unpacked into .deps/ (its .github/pins.env), then its own
# Makefile.apple:
#
#   make -f Makefile.apple ios                          build
#   make -f Makefile.apple ios-check                    test
#   make -f Makefile.apple ios-install DESTDIR=<dir>    each app (apps:, by its
#                                                       bundle name), for a device
#                                                       in <dir>/iphoneos and the
#                                                       simulator in
#                                                       <dir>/iphonesimulator
#   make -f Makefile.apple ios-installcheck DESTDIR=<dir>   optional: test the
#                                                       installed simulator apps
#
# then packaged as an .ipa (for a signing step to take later) and a simulator
# build, uploaded, and for a tag attached to the release.
on:
  workflow_call:
    inputs:
      repository:
        description: The repository to build (default the calling one; gnustep-release-actions' own test builds an app's)
        type: string
        default: ''
      ref:
        description: The commit or branch of it to build (default the tag, else the commit that started the run)
        type: string
        default: ''
      tag:
        description: The tag to build and attach to (empty for a push's own tag, or none)
        type: string
        default: ''
      directory:
        description: Where in the repository it is (its root by default)
        type: string
        default: .
      apps:
        description: Space-separated Name=Bundle pairs (SimpleNotes-iOS=SimpleNotes); <Name>-<version>-unsigned.ipa and <Name>-Simulator-<version>.zip
        type: string
        required: true

jobs:
  ios:
    name: iOS
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      APPS: ${{ inputs.apps }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source/${{ inputs.directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || inputs.tag || (github.ref_type == 'tag' && github.ref_name) || github.ref }}
          path: source
          # The whole history: the build number is the commit count (scripts/version.sh).
          fetch-depth: 0

      # This workflow's own commit, whatever the caller named (@v1, a branch,
      # a commit): its scripts and actions come from there, so a change here
      # is tested as one, and v1 is exactly what v1 holds.

      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-actions

      - name: Version
        run: '"$GITHUB_WORKSPACE/.release-actions/scripts/version.sh"'

      # The version into every Xcode project, .xcconfig, Info.plist and app
      # GNUmakefile the repository has, before its build: the same way for
      # every app, so no app stamps its own.
      - name: Stamp the version
        run: '"$GITHUB_WORKSPACE/.release-actions/scripts/stamp-version.sh"'

      - name: The artifact's name
        run: |
          set -- $APPS
          if [ $# = 1 ]; then name=${1%%=*}; else name=$(basename "${{ inputs.repository || github.repository }}"); fi
          echo "ARTIFACT=$name-iOS-$APP_VERSION" >> "$GITHUB_ENV"

      - name: What it builds on
        run: '"$GITHUB_WORKSPACE/.release-actions/scripts/deps.sh" apple'

      - name: make ios
        run: make -f Makefile.apple ios

      - name: make ios-check
        timeout-minutes: 30
        run: make -f Makefile.apple ios-check

      - name: make ios-install
        run: |
          mkdir -p "$RELEASE_DIR/iphoneos" "$RELEASE_DIR/iphonesimulator"
          make -f Makefile.apple ios-install DESTDIR="$RELEASE_DIR"
          for pair in $APPS; do
            for sdk in iphoneos iphonesimulator; do
              [ -d "$RELEASE_DIR/$sdk/${pair#*=}.app" ] || { echo "::error::make ios-install put no $sdk/${pair#*=}.app in DESTDIR"; exit 1; }
            done
          done

      - name: make ios-installcheck
        timeout-minutes: 30
        run: |
          grep -q '^ios-installcheck:' Makefile.apple || { echo "Makefile.apple has no ios-installcheck"; exit 0; }
          make -f Makefile.apple ios-installcheck DESTDIR="$RELEASE_DIR"

      - name: Package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          for pair in $APPS; do
            name=${pair%%=*}; bundle=${pair#*=}
            ipa=$(mktemp -d)
            mkdir -p "$ipa/Payload"
            cp -R "$RELEASE_DIR/iphoneos/$bundle.app" "$ipa/Payload/"
            (cd "$ipa" && zip -qry "$GITHUB_WORKSPACE/out/$name-$APP_VERSION-unsigned.ipa" Payload)
            ditto -c -k --keepParent "$RELEASE_DIR/iphonesimulator/$bundle.app" "$GITHUB_WORKSPACE/out/$name-Simulator-$APP_VERSION.zip"
          done
          ls -la "$GITHUB_WORKSPACE/out"

      # Named for the app and its version, like the files in it; a branch's
      # is kept two weeks, a tag's as long as artifacts are (its release
      # keeps the files for good).
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ github.workspace }}/out/*
          if-no-files-found: error
          retention-days: ${{ env.TAG == '' && 14 || 90 }}

      # What Xcode recorded of a failed test, for opening in Xcode.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ env.ARTIFACT }}-test-results
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach to the release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          files: ${{ github.workspace }}/out/*
