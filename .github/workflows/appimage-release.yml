# A GNUstep app's Linux release, the same for every repository: the patched
# GNUstep stack, the repository's build, an AppImage with its update
# information, a smoke test on a clean system, uploaded, and for a tag
# attached to the release with its .zsync.
#
# Built on the oldest Ubuntu LTS still in support: an AppImage carries its
# own libraries but not glibc, so it runs only on a system at least as new as
# the one it was linked on.
#
# The repository supplies names (inputs), its image's configuration and
# hooks (scripts at fixed paths, run from its root):
#   .github/release/linux-build.sh    (optional) builds its dependencies (checked out
#                                     beside source/) and the app, and installs
#                                     its apps and tools into the stack in
#                                     $PREFIX (GNUSTEP_INSTALLATION_DOMAIN=SYSTEM)
#   .github/release/appimage.conf     what the image carries and starts; the
#                                     image itself is the appimage action's
#                                     (appimage/appimage.sh), the same for all
#   .github/release/linux-test.sh     given the AppImage's path, exercises it;
#                                     run in a clean Ubuntu 22.04 container
#                                     (xvfb, python3 and the libraries every
#                                     desktop has; no fonts), from the root
# All see TAG, APP_VERSION, BUILD_NUMBER and the repository's pins.
on:
  workflow_call:
    inputs:
      repository:
        description: The repository to build (default the calling one; gnustep-release-actions' own test builds an app's)
        type: string
        default: ''
      ref:
        description: The commit or branch of it to build (default the tag, else the commit that started the run)
        type: string
        default: ''
      tag:
        description: The tag to build and attach to (empty for a push's own tag, or none)
        type: string
        default: ''
      dependencies:
        description: Space-separated ashalkhakov repositories checked out beside source/ at their pins (FreeCoreData -> FREECOREDATA_REF)
        type: string
        default: ''
      stack:
        description: The GNUstep stack's image (default the newest gnustep-patches published, ghcr.io/ashalkhakov/gnustep:latest)
        type: string
        default: ghcr.io/ashalkhakov/gnustep:latest
      extra-packages:
        description: The app's own build dependencies (apt packages), beyond the stack's
        type: string
        default: ''
      databases:
        description: Database servers the tests run against (postgres mysql mariadb), started for the hooks; see scripts/databases.sh
        type: string
        default: ''

jobs:
  appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || inputs.tag || (github.ref_type == 'tag' && github.ref_name) || github.ref }}
          path: source

      # This workflow's own commit, whatever the caller named (@v1, a branch,
      # a commit): its scripts and actions come from there, so a change here
      # is tested as one, and v1 is exactly what v1 holds.

      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-actions

      - name: Pins and dependencies
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
        run: '"$GITHUB_WORKSPACE/.release-actions/scripts/pins-and-dependencies.sh"'

      - name: Version
        run: '"$GITHUB_WORKSPACE/.release-actions/scripts/version.sh"'

      # The version into every Xcode project, .xcconfig, Info.plist and app
      # GNUmakefile the repository has, before its build: the same way for
      # every app, so no app stamps its own.
      - name: Stamp the version
        run: '"$GITHUB_WORKSPACE/.release-actions/scripts/stamp-version.sh"'

      - name: GNUstep
        uses: ./.release-actions/gnustep-stack
        with:
          image: ${{ inputs.stack }}
          extra-packages: ${{ inputs.extra-packages }}

      - name: Databases
        if: inputs.databases != ''
        env:
          DATABASES: ${{ inputs.databases }}
        run: '"$GITHUB_WORKSPACE/.release-actions/scripts/databases.sh"'

      - name: Build
        run: |
          if [ -x .github/release/linux-build.sh ]; then ./.github/release/linux-build.sh; else echo "no .github/release/linux-build.sh"; fi

      - name: The image's name
        id: name
        run: |
          image=$(. .github/release/appimage.conf; echo "${IMAGE:-}")
          [ -n "$image" ] || { echo "::error::.github/release/appimage.conf names no IMAGE"; exit 1; }
          echo "APPIMAGE=$image" >> "$GITHUB_ENV"
          echo "ARTIFACT=$image-$APP_VERSION-$(uname -m)" >> "$GITHUB_ENV"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Update information
        uses: ./.release-actions/appimage-update-info
        with:
          tag: ${{ env.TAG }}
          zsync: ${{ steps.name.outputs.image }}-*x86_64.AppImage.zsync

      - name: Package
        uses: ./.release-actions/appimage
        with:
          working-directory: ${{ github.workspace }}/source

      - name: Out
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          mv "$APPIMAGE"-*.AppImage "$GITHUB_WORKSPACE/out/"
          mv "$APPIMAGE"-*.AppImage.zsync "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          if [ -n "${LDAI_UPDATE_INFORMATION:-}" ] && ! ls "$GITHUB_WORKSPACE/out/"*.zsync > /dev/null 2>&1; then
            echo "::error::a release's AppImage has no .zsync beside it"; exit 1
          fi
          ls -la "$GITHUB_WORKSPACE/out"

      - name: The image
        id: image
        run: echo "image=$(ls "$GITHUB_WORKSPACE/out/$APPIMAGE"-*.AppImage)" >> "$GITHUB_OUTPUT"

      - name: Smoke test, on a clean Ubuntu 22.04
        uses: ./.release-actions/appimage-test
        with:
          image: ${{ steps.image.outputs.image }}
          working-directory: ${{ github.workspace }}/source

      # Named for the app and its version, like the files in it; a branch's
      # is kept two weeks, a tag's as long as artifacts are (its release
      # keeps the files for good).
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ github.workspace }}/out/*
          if-no-files-found: error
          retention-days: ${{ env.TAG == '' && 14 || 90 }}

      - name: Attach to the release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          files: ${{ github.workspace }}/out/*
