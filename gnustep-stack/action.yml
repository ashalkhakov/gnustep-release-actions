name: GNUstep stack
description: >
  The patched GNUstep stack an app builds on, on Ubuntu 22.04: taken from the
  image gnustep-patches publishes (ghcr.io/ashalkhakov/gnustep, the newest
  unless told otherwise), not built here. Its /opt/gnustep is copied onto the
  runner, the packages building on it needs are installed from the list the
  image carries (and the app's own), and the stack is verified. Sets CC, CXX,
  LIBRARY_COMBO, RUNTIME_VERSION, PREFIX and LD_LIBRARY_PATH for the rest of
  the job, and says which stack it is (its VERSION and MANIFEST).
inputs:
  image:
    description: The stack's image (a version tag, or latest)
    required: false
    default: ghcr.io/ashalkhakov/gnustep:latest
  extra-packages:
    description: The app's own build dependencies (apt packages), beyond the stack's
    required: false
    default: ''
outputs:
  version:
    description: The stack's version (gnustep-patches' tag, less its v)
    value: ${{ steps.stack.outputs.version }}
runs:
  using: composite
  steps:
    - name: Stack
      id: stack
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        for i in 1 2 3; do docker pull -q "$IMAGE" && break; [ "$i" != 3 ] || exit 1; sleep 10; done
        id=$(docker create "$IMAGE")
        sudo rm -rf /opt/gnustep
        sudo docker cp "$id:/opt/gnustep" /opt/gnustep
        docker rm "$id" > /dev/null
        sudo chown -R "$(id -u):$(id -g)" /opt/gnustep
        d=/opt/gnustep/share/gnustep-patches
        echo "GNUstep $(cat "$d/VERSION") from $IMAGE ($(docker image inspect -f '{{index .RepoDigests 0}}' "$IMAGE"))"
        cat "$d/MANIFEST"
        echo "version=$(cat "$d/VERSION")" >> "$GITHUB_OUTPUT"
        {
          echo "CC=clang"
          echo "CXX=clang++"
          echo "LIBRARY_COMBO=ng-gnu-gnu"
          echo "RUNTIME_VERSION=gnustep-2.0"
          echo "PREFIX=/opt/gnustep"
          # libobjc2 and libdispatch land in the prefix's plain lib/, which
          # the gnustep layout does not treat as a library root.
          echo "LD_LIBRARY_PATH=/opt/gnustep/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        } >> "$GITHUB_ENV"

    # The image's own list (Scripts/packages-ubuntu.txt), so the runner has
    # what the image was built with. From Ubuntu's archive only: the runner
    # image carries Google Chrome's and Microsoft's apt sources, which nothing
    # here installs from, and Google republishes its index several times a
    # day, so an update straddling a republish fails on a hash mismatch.
    # Ubuntu's mirrors fail now and then too: tried three times.
    - name: Packages
      shell: bash
      env:
        EXTRA: ${{ inputs.extra-packages }}
      run: |
        set -euo pipefail
        sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/*google* \
                   /etc/apt/sources.list.d/microsoft* || true
        packages=$(grep -v '^#' /opt/gnustep/share/gnustep-patches/packages-ubuntu.txt | tr '\n' ' ')
        for i in 1 2 3; do
          sudo apt-get -q -o Acquire::Retries=3 update \
            && sudo apt-get -q -y -o Acquire::Retries=3 install $packages $EXTRA && break
          [ "$i" != 3 ] || exit 1
          sleep 10
        done
        # The gnustep-2.0 runtime needs ld.gold or lld; 22.04's binutils has gold.
        sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.gold 10

    # Checked here as it was where it was built: libdispatch's main-queue
    # hooks in gnustep-base, ICU, the backend bundle.
    - name: Verify
      shell: bash
      run: PREFIX=/opt/gnustep /opt/gnustep/share/gnustep-patches/build-gnustep.sh --verify-only
