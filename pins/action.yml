name: Pins
description: >
  Loads a repository's pins, the one file where it names the commits of
  what it builds on (KEY=<full commit hash>, one per line, # for comments),
  into the environment of the rest of the job, so every workflow and script
  reads the same ones and a pin is moved in one place. Each value must be a
  full 40-character commit hash: a branch or a short hash would move under
  the build.
inputs:
  file:
    description: The pins file, relative to the workspace (default, the source checkout's .github/pins.env)
    required: false
    default: .github/pins.env
outputs:
  names:
    description: The names loaded, space-separated
    value: ${{ steps.pins.outputs.names }}
runs:
  using: composite
  steps:
    - id: pins
      shell: bash
      env:
        FILE: ${{ inputs.file }}
      run: '"$GITHUB_ACTION_PATH/../scripts/pins.sh"'
